<a [routerLink]="['/produkt', product().id]" class="product-card">
@if (isNew()) {
<span class="badge-new">NYHET</span>
}
<img [src]="product().imageUrl" [alt]="product().name">
<button class="favorite-icon" aria-label="Lägg till favorit" (click)="$event.stopPropagation(); $event.preventDefault()">
    <svg lucideHeart></svg>
</button>
<p class="product-price">{{ product().price }},95KR</p>
<p class="product-name">{{ product().name }}</p>
</a>
